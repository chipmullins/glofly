# The live Glofly server (one EC2 machine). Run from the deploy/ folder:
#   docker compose up -d --build
# Postgres is NOT here: it's Amazon RDS. Files are in S3. Only Caddy faces the internet.
# Caddy also serves the website (site/ folder) at glofly.app, and Glofly in a browser
# (apps/web, built by the "web" service below) at chat.glofly.app.
services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1" # Caddy is the one hop in front
      PORT: "4000"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Emails go out through Amazon SES (the machine's role gives permission); links in them
      # point at the website, which hands /reset and /confirm to this server.
      EMAIL_TRANSPORT: ses
      SITE_URL: https://${SITE_DOMAIN:-glofly.app}
      # Glofly Control: only from these addresses (Caddy checks too). ADMIN_KEY comes from .env.
      ADMIN_IPS: ${ADMIN_IPS:-127.0.0.1}
      # Control → Server → Restart server: the server stops and Docker (restart: unless-stopped)
      # starts it again. This tells it that's safe here.
      GLOFLY_RESTARTS: docker
      # Glofly in a browser: the only page allowed to sign in with a cookie, call the API from a
      # browser (CORS) and open the live connection with that cookie. Emergency off switch: put
      # WEB_ORIGIN= (nothing after the =) in .env and run docker compose up -d; the desktop and
      # phone apps don't use any of it.
      WEB_ORIGIN: ${WEB_ORIGIN-https://chat.glofly.app}
    volumes:
      # Files the server reads but that must never be in the repo (the Firebase key for push
      # notifications). Put them in deploy/secrets/ on the server (chmod 600).
      - ./secrets:/run/glofly-secrets:ro
    depends_on:
      - redis
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # 0.9.0: tells Control for iPhone when the server stops answering (and when it's back). Same image
  # as the server, its own small program (apps/server/src/watchdog.ts). It never touches users.
  watchdog:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      WATCHDOG_URL: http://server:4000/health
    command: ["node", "dist/watchdog.js"]
    volumes:
      - ./secrets:/run/glofly-secrets:ro
    depends_on:
      - server
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }

  # Builds Glofly in a browser (apps/web) and copies it into the chat_site volume for Caddy,
  # then stops (that's normal: "Exited (0)" in docker compose ps -a).
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        GLOFLY_API_URL: https://${API_DOMAIN}
    restart: "no"
    volumes:
      - chat_site:/out

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    # Presence and typing only: nothing here needs to survive a restart. No ports published.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN:-glofly.app}
      WEB_DOMAIN: ${WEB_DOMAIN:-chat.glofly.app}
      ADMIN_IPS: ${ADMIN_IPS:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro # the website
      - chat_site:/srv/chat:ro # Glofly in a browser (filled by the web service)
      - caddy_data:/data # the https certificates: keep this volume
      - caddy_config:/config
    depends_on:
      - server

volumes:
  chat_site:
  caddy_data:
  caddy_config:
