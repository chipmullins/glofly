# The live Glofly server (one EC2 machine). Run from the deploy/ folder:
#   docker compose up -d --build
# Postgres is NOT here: it's Amazon RDS. Files are in S3. Only Caddy faces the internet.
# Caddy also serves the website (site/ folder) at glofly.app.
services:
  server:
    build:
      context: ..
      dockerfile: deploy/server.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1" # Caddy is the one hop in front
      PORT: "4000"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Emails go out through Amazon SES (the machine's role gives permission); links in them
      # point at the website, which hands /reset and /confirm to this server.
      EMAIL_TRANSPORT: ses
      SITE_URL: https://${SITE_DOMAIN:-glofly.app}
      # Glofly Control: only from these addresses (Caddy checks too). ADMIN_KEY comes from .env.
      ADMIN_IPS: ${ADMIN_IPS:-127.0.0.1}
    volumes:
      # Files the server reads but that must never be in the repo (the Firebase key for push
      # notifications). Put them in deploy/secrets/ on the server (chmod 600).
      - ./secrets:/run/glofly-secrets:ro
    depends_on:
      - redis
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    # Presence and typing only: nothing here needs to survive a restart. No ports published.

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      SITE_DOMAIN: ${SITE_DOMAIN:-glofly.app}
      ADMIN_IPS: ${ADMIN_IPS:-127.0.0.1}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site:/srv/site:ro # the website
      - caddy_data:/data # the https certificates: keep this volume
      - caddy_config:/config
    depends_on:
      - server

volumes:
  caddy_data:
  caddy_config:
