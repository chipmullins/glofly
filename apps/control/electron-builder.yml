# Packaging Glofly Control (npm run build:win -w apps/control → dist/Glofly-Control-<version>-setup.exe).
# Only Chip installs this. It is NOT part of Glofly releases or auto-updates, and never goes
# to the glofly-updates bucket.
appId: com.glofly.control # must match setAppUserModelId in src/main/index.ts
productName: Glofly Control
copyright: Copyright © 2026 Glofly
directories:
  buildResources: build
# Electron's built-in switches ("fuses"), flipped in the packaged app (not in npm run dev):
# the Glofly program can't be reused as a plain Node.js runner, doesn't take Node options or a
# debugger from the command line or environment, and only runs its own signed-in-place app.asar
# (checked against the hash built into the program), so nobody can swap in other code.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,README.md}'
  - '!{.env,.env.*,.npmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: GloflyControl
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  artifactName: Glofly-Control-${version}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: Glofly Control
  uninstallDisplayName: Glofly Control
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
npmRebuild: false
# No auto-updates: rebuild and reinstall when Control changes.
publish: null
# Oct 31, 2026: Glofly Control for Chip's Mac (the "Control Mac build" GitHub Action, run by hand).
# One universal app as a .dmg, signed with Glofly's Developer ID and notarized like the Glofly Mac
# app (same repository secrets). Never published anywhere: the .dmg is only in the Action's
# Artifacts (private repository). Like on Windows, closing the window signs out and quits.
mac:
  icon: build/icon.icns
  minimumSystemVersion: '13.0' # Electron 44
  category: public.app-category.developer-tools
  artifactName: Glofly-Control-${version}-mac.${ext}
  target:
    - target: dmg
      arch: universal
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: Glofly-Control-${version}-mac.${ext}
