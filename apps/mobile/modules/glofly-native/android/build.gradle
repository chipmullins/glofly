plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.glofly'
version = '1.0.0'

android {
  namespace "com.glofly.nativebridge"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
  // Push notifications. Without a google-services.json in the app, Firebase simply isn't set up
  // and getPushToken() returns null.
  implementation "com.google.firebase:firebase-messaging:24.1.0"
}
