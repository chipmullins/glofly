# Packaging Glofly into an installer (npm run build:win → dist/Glofly-<version>-setup.exe)
appId: com.glofly.app # must match setAppUserModelId in src/main/index.ts (taskbar + notifications)
productName: Glofly
copyright: Copyright © 2026 Glofly
directories:
  buildResources: build
# 0.8.0: glofly:// links ("Open in Glofly" on a friend's invite page) open Glofly
# (src/main/deepLinks.ts). On the Mac this is what puts the scheme in Info.plist; Windows also
# registers it when Glofly starts (app.setAsDefaultProtocolClient).
protocols:
  - name: Glofly
    schemes:
      - glofly
# Electron's built-in switches ("fuses"), flipped in the packaged app (not in npm run dev):
# the Glofly program can't be reused as a plain Node.js runner, doesn't take Node options or a
# debugger from the command line or environment, and only runs its own signed-in-place app.asar
# (checked against the hash built into the program), so nobody can swap in other code.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources/icon-options/**' # saved icon designs: kept in the repo, not shipped
  # Push to talk's keyboard hook ships ready-made copies for every computer in prebuilds/. If npm
  # also compiled one into build/ (it does on GitHub's Macs), that copy wins at runtime and is only
  # for the chip it was built on, so it would break Push to talk on the other kind of Mac (and the
  # universal Mac build refuses it). Leave it out: the prebuilt copies are always used.
  - '!**/node_modules/uiohook-napi/build/**'
asarUnpack:
  - resources/**
  # Push to talk's native keyboard hook: .node files can't load from inside the archive
  - '**/node_modules/uiohook-napi/**'
  # 0.5.0 screen sound (src/main/screenSound): Windows' capture (loopback-capture, plus koffi to
  # find a window's app) and the Mac's AudioTee helper, which must be a real file to run.
  - '**/node_modules/loopback-capture/**'
  - '**/node_modules/koffi/**'
  - '**/node_modules/@koromix/**'
  - '**/node_modules/audiotee/bin/**'
win:
  executableName: Glofly
  icon: build/icon.ico
nsis:
  # One click: double-click the setup file, a short branded install, and Glofly opens.
  oneClick: true
  perMachine: false # installs for this Windows user, so no admin prompt
  artifactName: Glofly-${version}-setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  shortcutName: Glofly
  uninstallDisplayName: Glofly
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  deleteAppDataOnUninstall: false # keeps sign-in and settings if Glofly is reinstalled
  include: build/installer.nsh # the red Glofly splash while installing
# Mac builds (the "Mac build" GitHub Action): one universal app (Apple Silicon + Intel) as a .dmg
# for downloading and a .zip + latest-mac.yml for auto-updates.
# Signed with Glofly's Developer ID, hardened runtime on, and notarized by Apple, so it opens like
# any App Store-free Mac app and macOS remembers its permissions (notifications, Screen Recording,
# the Keychain item that keeps you signed in) from one version to the next. The certificate and the
# notary key come from repository secrets (see .github/workflows/mac-build.yml). Without them the
# Action falls back to the old ad-hoc test build (it overrides identity/hardenedRuntime/notarize).
mac:
  icon: build/icon.icns
  # Electron 44 needs macOS 13 (Ventura) or newer.
  minimumSystemVersion: '13.0'

  category: public.app-category.social-networking
  # Names the .zip (and the .dmg, which also sets it below): Glofly-<version>-mac.zip / .dmg.
  # electron-builder has no top-level "zip:" section.
  artifactName: Glofly-${version}-mac.${ext}
  target:
    - target: dmg
      arch: universal
    - target: zip # what Mac auto-updates download (electron-updater can't install from a .dmg)
      arch: universal
  # identity: found automatically from the certificate in CSC_LINK (Developer ID Application).
  hardenedRuntime: true
  gatekeeperAssess: false
  # Notarized with an App Store Connect API key: APPLE_API_KEY (path to the .p8), APPLE_API_KEY_ID,
  # APPLE_API_ISSUER. electron-builder staples the ticket to the app.
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Universal build: the keyboard hook's prebuilt darwin-x64 and darwin-arm64 files sit side by side
  # in both halves and the right one is picked at runtime, so keep them as they are (no merging).
  # Same for koffi (installed on the Mac only for its own chip; Glofly uses it on Windows only).
  # Don't add platform-level "files:" lists to this file: electron-builder then drops its
  # default rules and packs dist/ (old installers) into the app (the 0.5.0 build hit 4 GB).
  x64ArchFiles: '{**/node_modules/uiohook-napi/prebuilds/darwin-*/*.node,**/node_modules/@koromix/**}'
  # The words in macOS's permission prompts. Without them macOS won't let Glofly ask at all.
  extendInfo:
    NSCameraUsageDescription: Glofly uses your camera for video calls.
    NSMicrophoneUsageDescription: Glofly uses your microphone for voice and video calls.
    # macOS 14.2+: sending a game's or the computer's sound with a shared screen (0.5.0).
    NSAudioCaptureUsageDescription: Glofly sends the sound of what you share with your screen.
dmg:
  artifactName: Glofly-${version}-mac.${ext}
linux:
  target:
    - AppImage
  maintainer: Glofly
  category: Network
appImage:
  artifactName: Glofly-${version}.${ext}
npmRebuild: false
# Auto-updates: a release uploads Glofly-<version>-setup.exe, its .blockmap and latest.yml
# to the public glofly-updates bucket (Mac: the Mac build Action uploads Glofly-<version>-mac.zip,
# its .blockmap and latest-mac.yml). (The app reads the same address from .env.production.)
publish:
  provider: generic
  url: https://glofly-updates.s3.us-east-2.amazonaws.com
