<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Glofly</title>
    <!-- 0.8.6: the small "Checking for updates" window Glofly opens with (src/main/launchUpdate.ts).
         It loads nothing from the internet: its words come from the main process. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>

  <body>
    <main id="card" class="gf-card" data-phase="checking">
      <span
        class="gf-star"
        aria-hidden="true"
        style="left: 46px; top: 52px; width: 3px; height: 3px"
      ></span>
      <span
        class="gf-star"
        aria-hidden="true"
        style="left: 300px; top: 40px; width: 2px; height: 2px; animation-delay: 1.2s"
      ></span>
      <span
        class="gf-star gold"
        aria-hidden="true"
        style="left: 318px; top: 160px; width: 3px; height: 3px; animation-delay: 0.6s"
      ></span>
      <span
        class="gf-star gold"
        aria-hidden="true"
        style="left: 28px; top: 200px; width: 2px; height: 2px; animation-delay: 2s"
      ></span>

      <div class="gf-stage" aria-hidden="true">
        <div class="gf-halo"></div>
        <div class="gf-path"></div>
        <div class="gf-ring"></div>
        <div class="gf-ring" style="animation-delay: 0.8s"></div>
        <div class="gf-trail">
          <span style="--i: 1"></span>
          <span style="--i: 2"></span>
          <span style="--i: 3"></span>
          <span style="--i: 4"></span>
          <span style="--i: 5"></span>
          <span style="--i: 6"></span>
        </div>
        <div class="gf-fly">
          <!-- The Glofly firefly in four pieces (body, left wings, right wings, light) so the wings
               can flap from where they meet the body (490, 490). Same drawing as the approved
               "Glofly Desktop Updater" canvas. -->
          <svg viewBox="110 200 820 640" width="100%" height="100%">
            <defs>
              <linearGradient id="gf-b" x1="0" y1="0" x2="0.3" y2="1">
                <stop offset="0" stop-color="#FFD24A" />
                <stop offset="1" stop-color="#FFB000" />
              </linearGradient>
              <linearGradient id="gf-u" x1="1" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#FFD21F" />
                <stop offset="0.55" stop-color="#FF9A10" />
                <stop offset="1" stop-color="#FF6A00" />
              </linearGradient>
            </defs>
            <g>
              <path
                d="M520 352 C524 332 520 316 506 304"
                fill="none"
                stroke="#FFB000"
                stroke-width="22"
                stroke-linecap="round"
              />
              <circle cx="505" cy="301" r="14" fill="#FFB000" />
              <path
                d="M596 398 C616 380 640 374 662 382"
                fill="none"
                stroke="#FFB000"
                stroke-width="22"
                stroke-linecap="round"
              />
              <circle cx="664" cy="382" r="14" fill="#FFB000" />
              <ellipse
                cx="455"
                cy="528"
                rx="78"
                ry="52"
                transform="rotate(-38 455 528)"
                fill="url(#gf-b)"
              />
              <circle cx="540" cy="428" r="74" fill="url(#gf-b)" />
            </g>
            <g class="gf-wl" fill="none" stroke="#FFA030" stroke-width="30" stroke-linejoin="round">
              <path
                d="M490 490 C420 380 268 222 182 238 C124 250 136 330 200 382 C280 444 400 470 490 490 Z"
              />
              <path
                d="M490 490 C400 456 262 432 192 456 C142 474 150 536 222 546 C302 556 410 520 490 490 Z"
              />
            </g>
            <g class="gf-wr" fill="none" stroke="#FFA030" stroke-width="30" stroke-linejoin="round">
              <path
                d="M490 490 C620 500 800 520 860 580 C905 626 870 690 780 680 C680 668 572 560 490 490 Z"
              />
              <path
                d="M490 490 C500 600 540 705 598 768 C632 804 694 796 676 736 C658 672 566 566 490 490 Z"
              />
            </g>
            <g>
              <rect x="282" y="588" width="216" height="154" rx="50" fill="url(#gf-u)" />
              <path d="M322 722 L318 778 Q320 794 336 784 L392 738 Z" fill="#FF7000" />
            </g>
          </svg>
        </div>
      </div>

      <div class="gf-words" aria-live="polite">
        <h1 id="title">Checking for updates</h1>
        <p id="detail" class="gf-detail"></p>
      </div>
      <div class="gf-dots" aria-hidden="true">
        <span></span><span style="animation-delay: 0.2s"></span
        ><span style="animation-delay: 0.4s"></span>
      </div>
      <div
        id="bar"
        class="gf-bar"
        role="progressbar"
        aria-label="Update download"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div id="fill" class="gf-fill"></div>
      </div>
      <div class="gf-grow"></div>
      <p id="foot" class="gf-foot">Usually about a second.</p>
    </main>
    <script type="module" src="/src/updater/updater.ts"></script>
  </body>
</html>
