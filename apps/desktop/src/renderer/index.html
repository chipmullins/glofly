<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Glofly</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         connect-src: calls connect to LiveKit Cloud (audio/video). Change it if calls move elsewhere. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: glofly-media:; connect-src 'self' glofly-media: wss://*.livekit.cloud https://*.livekit.cloud; media-src 'self' blob: mediastream:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
