<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Glofly</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP
         connect-src: calls connect to LiveKit Cloud (audio/video). Change it if calls move elsewhere.
         frame-src: only the Glofly server's Watch Together player page (filled in at build time).
         img-src i.ytimg.com: the YouTube video's picture in the Watch together dialog.
         img-src media.giphy.com: GIFs (0.5.0), only ever from GIPHY's own servers. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: glofly-media: https://i.ytimg.com https://media.giphy.com; connect-src 'self' glofly-media: wss://*.livekit.cloud https://*.livekit.cloud; media-src 'self' blob: mediastream: glofly-media:; frame-src %GLOFLY_SERVER_ORIGIN%; object-src 'none'; base-uri 'none'"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
