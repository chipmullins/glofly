# iOS build check: compiles the Glofly phone app (apps/mobile) for the iPhone Simulator.
#
# Claude's sandbox can't build iOS, so this is where Swift, CocoaPods and Xcode mistakes show up
# (the same job the Android build does for Kotlin). It doesn't make anything installable: a real
# iPhone build needs Apple signing, which EAS does (`eas build -p ios --profile preview`).
#
# macOS minutes count 10× against the free Actions allowance (~25 min a build ≈ 250 minutes), so
# it only runs when the native side changes (Swift, the app config, packages), and by hand.

name: iOS build

on:
  workflow_dispatch:
  push:
    # ci/* branches: Claude's compile checks before native code lands on dev.
    branches: [dev, 'ci/**']
    # Only what changes the native iPhone app (JavaScript-only changes don't need a compile).
    paths:
      - 'apps/mobile/modules/glofly-native/**'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/package.json'
      - 'package-lock.json'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    # Expo SDK 57 needs Xcode 26 or newer (macos-15's default Xcode 16.4 can't build it, Oct 12).
    runs-on: macos-26
    timeout-minutes: 75
    env:
      APP_VARIANT: preview
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Use Xcode 26
        # The newest Xcode 26 release on the runner (not a beta); otherwise the runner's default.
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version

      - name: Install packages
        run: npm ci --ignore-scripts

      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Generate the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build for the Simulator
        working-directory: apps/mobile/ios
        run: |
          # The full log is huge; on failure, show the actual errors (the summary alone names only
          # the step that failed).
          if ! xcodebuild -workspace Glofly.xcworkspace -scheme Glofly -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build > build.log 2>&1; then
            grep -n -B2 -A6 -E "error:|fatal error|Command .* failed|\*\* BUILD FAILED" build.log | head -n 300
            tail -n 60 build.log
            exit 1
          fi
          tail -n 5 build.log
