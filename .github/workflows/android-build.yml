# Android build: compiles the Glofly phone app (apps/mobile) into an installable APK.
#
# Two jobs in one:
#   - a check that the native Android code still compiles (Claude's sandbox can't build Android,
#     so this is where Kotlin and Gradle mistakes show up)
#   - a test APK anyone can install: Actions → Android build → the run → Artifacts →
#     "Glofly-android-<run>" (GitHub zips it; unzip → Glofly.apk). On the phone: allow
#     "Install unknown apps" for the browser or Files app once, then open the APK.
# The APK talks to the live server (https://api.glofly.app) and is signed with a throwaway debug
# key, so Android treats it as a different app from the Play Store / EAS builds: uninstall one
# before installing the other. Real releases come from EAS (`eas build`), not from here.
#
# Push notifications need the Firebase settings file: add a repository secret
# GOOGLE_SERVICES_JSON (Settings → Secrets and variables → Actions) holding the whole
# google-services.json. Without it the APK works, just without push.
#
# Runs on pushes to dev that touch the phone app or the shared package, and by hand
# (Run workflow, once this file is on the default branch). Linux minutes count 1× (~15 min a build).

name: Android build

on:
  workflow_dispatch:
  push:
    # ci/* branches: Claude's compile checks for native code before it lands on dev.
    branches: [dev, 'ci/**']
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      # Not package-lock.json: every desktop release bumps the version in it, which set these
      # off for nothing. Phone dependency changes also change apps/mobile/package.json.
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_VARIANT: preview
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packages
        # The desktop app's install step (rebuilding its native keyboard hook for Electron) isn't
        # needed here, so install scripts are skipped.
        run: npm ci --ignore-scripts

      - name: Firebase settings (if the secret is set)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
            echo "Push notifications: on"
          else
            echo "::warning::No GOOGLE_SERVICES_JSON secret: this APK has no push notifications."
          fi

      - name: Typecheck
        working-directory: apps/mobile
        run: npx tsc --noEmit

      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Give Gradle more memory
        # Expo's template caps Gradle at 2 GB with 512 MB of Metaspace; the build ran out of
        # Metaspace and crawled to the 60-minute limit (every run from Oct 13 to Oct 20). The
        # runner has 16 GB; 6 GB + 3 GB here got the whole job killed, so these stay modest.
        working-directory: apps/mobile/android
        run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          # The generated file has no newline at the end: add one before appending.
          [ -n "$(tail -c1 gradle.properties)" ] && echo >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' >> gradle.properties
          echo 'kotlin.daemon.jvmargs=-Xmx2g' >> gradle.properties
          # Fewer things at once: 4 parallel C++ compiles plus two JVMs ran the runner out of memory.
          echo 'org.gradle.workers.max=3' >> gradle.properties
          tail -n 6 gradle.properties

      - name: Install the Android NDK
        # Gradle would download it itself, but gives up on one bad download ("Error on ZipFile
        # unknown archive", Oct 12). Installing it first lets a broken download be retried.
        # The version is the one Expo SDK 57 asks for (printed as "ndk:" when Gradle starts).
        run: |
          ndk="27.1.12297006"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for try in 1 2 3; do
            if [ -f "$ANDROID_HOME/ndk/$ndk/source.properties" ]; then echo "NDK $ndk ready"; exit 0; fi
            rm -rf "$ANDROID_HOME/ndk/$ndk"
            yes | "$sdkmanager" --install "ndk;$ndk" > /dev/null || echo "Download $try failed, trying again"
            sleep 5
          done
          test -f "$ANDROID_HOME/ndk/$ndk/source.properties"

      - name: Build the APK
        working-directory: apps/mobile/android
        run: |
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64 2>&1 | tee build.log; then
            # The first errors as annotations too (readable without the full log).
            { grep -E "^e: |error:" build.log | head -n 30; grep -E "> Task .* FAILED" build.log; grep -A8 "What went wrong" build.log; } | grep -v '^--$' | awk '!seen[$0]++' | head -n 48 | while IFS= read -r line; do
              echo "::error::${line:0:900}"
            done
            exit 1
          fi

      - name: Collect the APK
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/Glofly.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Glofly-android-${{ github.run_number }}
          path: out/Glofly.apk
          retention-days: 14
