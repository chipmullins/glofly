# Sends the newest iPhone production build (made with `eas build -p ios --profile production`) to
# App Store Connect, the same as running `eas submit -p ios --latest` on the PC. Run it by hand from
# GitHub → Actions → "iOS submit" → Run workflow (works from the GitHub phone app).
#
# Needs the repository secret EXPO_TOKEN (expo.dev → Account settings → Access tokens). The Apple
# side uses the App Store Connect key EAS already keeps from the first `eas submit` on the PC.
# Runs on Linux (no Mac minutes) and only uploads; it builds nothing.

name: iOS submit

on:
  workflow_dispatch:
    inputs:
      asc_app_id:
        description: "Glofly's Apple ID number (App Store Connect → Glofly → App Information → Apple ID)"
        required: true

permissions:
  contents: read

concurrency:
  group: ios-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check the Expo key is there
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret first (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install packages
        run: npm ci --ignore-scripts

      - name: Say which App Store Connect app to send it to
        working-directory: apps/mobile
        env:
          ASC_APP_ID: ${{ inputs.asc_app_id }}
        run: |
          case "$ASC_APP_ID" in (*[!0-9]*|'') echo "::error::The Apple ID is a number, like 6741234567."; exit 1;; esac
          node -e '
            const fs = require("fs")
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"))
            eas.submit.production.ios = { ...(eas.submit.production.ios || {}), ascAppId: process.env.ASC_APP_ID }
            fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2))
          '

      - name: Send the newest iPhone build to App Store Connect
        working-directory: apps/mobile
        run: npx --yes eas-cli@latest submit -p ios --profile production --latest --non-interactive --wait
