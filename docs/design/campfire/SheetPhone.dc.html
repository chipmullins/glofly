<x-dc>
<helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: #140f0d; color: #f3e6da; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">

    <span style="flex: none; background: radial-gradient(circle at 50% 36%, #e7c9a8 0 22%, #3d6b3f 23% 100%); width: 48px; height: 48px; border-radius: 50%; box-shadow: 0 0 0 3px #57c27a"></span>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><h1 style="margin: 0; font: 800 19px/1.1 Outfit, sans-serif">Lyra Vesperwind</h1><span style="font-size: 12px; color: #c9b6a8">Wood elf · Ranger 5</span></div>
  </header>
  <div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">

      <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 12px; color: #c9b6a8; flex: 1">Hit points</span><b style="font: 800 24px/1 Outfit, sans-serif">38</b><span style="color: #c9b6a8">/ 44</span><span style="margin-left: 4px; padding: 3px 7px; border-radius: 999px; background: #1a2333; color: #9cc0ff; font: 700 11px/1 'DM Sans', sans-serif">+5</span></div>
      <div style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; display: flex"><div style="width: 86%; background: #57c27a"></div><div style="width: 11%; background: #6f9cff"></div></div>
      <div style="display: flex; gap: 6px"><button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 0; background: #4a1d18; color: #ffb0a8; font: 700 14px/1 'DM Sans', sans-serif">Damage</button><button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: 0; background: #183a26; color: #9ce6bb; font: 700 14px/1 'DM Sans', sans-serif">Heal</button></div>
    </div>
    <div style="display: flex; gap: 8px"><div style="flex: 1; min-width: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border-radius: 14px; background: #1f1714; box-shadow: 0 0 0 1px rgba(255,255,255,0.10)"><span style="font: 800 22px/1 Outfit, sans-serif; color: #f3e6da">15</span><span style="font-size: 12px; color: #c9b6a8">AC</span></div><div style="flex: 1; min-width: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border-radius: 14px; background: #1f1714; box-shadow: 0 0 0 1px rgba(255,255,255,0.10)"><span style="font: 800 22px/1 Outfit, sans-serif; color: #f3e6da">+4</span><span style="font-size: 12px; color: #c9b6a8">Init</span></div><div style="flex: 1; min-width: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 8px; border-radius: 14px; background: #1f1714; box-shadow: 0 0 0 1px rgba(255,255,255,0.10)"><span style="font: 800 22px/1 Outfit, sans-serif; color: #f3e6da">35</span><span style="font-size: 12px; color: #c9b6a8">Speed</span></div></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 12px; background: #2a1f33; box-shadow: inset 0 0 0 1px rgba(181,124,255,0.4); font-size: 13px"><span style="color: #cfa8ff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg></span><span style="flex: 1"><b>Hunter's Mark</b> <span style="color: #c9b6a8">· concentrating</span></span></div>
    <div role="tablist" aria-label="Sheet sections" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #120d0b; overflow: hidden"><button type="button" role="tab" aria-selected="true" style="flex: none; height: 36px; padding: 0 12px; border-radius: 9px; border: 0; background: #3a2614; color: #ffb347; font: 700 13px/1 'DM Sans', sans-serif">Overview</button><button type="button" role="tab" aria-selected="false" style="flex: none; height: 36px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; color: #c9b6a8; font: 700 13px/1 'DM Sans', sans-serif">Actions</button><button type="button" role="tab" aria-selected="false" style="flex: none; height: 36px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; color: #c9b6a8; font: 700 13px/1 'DM Sans', sans-serif">Spells</button><button type="button" role="tab" aria-selected="false" style="flex: none; height: 36px; padding: 0 12px; border-radius: 9px; border: 0; background: transparent; color: #c9b6a8; font: 700 13px/1 'DM Sans', sans-serif">More</button></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><button type="button" aria-label="Roll STR check" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.10); background: #2a201b; color: #f3e6da"><span style="font: 700 11px/1 'DM Sans', sans-serif; letter-spacing: .08em; color: #c9b6a8">STR</span><span style="font: 800 26px/1 Outfit, sans-serif">+0</span><span style="min-width: 34px; padding: 3px 0; border-radius: 999px; background: #120d0b; font-size: 12px; color: #c9b6a8">10</span></button><button type="button" aria-label="Roll DEX check" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.10); background: #2a201b; color: #f3e6da"><span style="font: 700 11px/1 'DM Sans', sans-serif; letter-spacing: .08em; color: #c9b6a8">DEX</span><span style="font: 800 26px/1 Outfit, sans-serif">+4</span><span style="min-width: 34px; padding: 3px 0; border-radius: 999px; background: #120d0b; font-size: 12px; color: #c9b6a8">18</span></button><button type="button" aria-label="Roll CON check" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.10); background: #2a201b; color: #f3e6da"><span style="font: 700 11px/1 'DM Sans', sans-serif; letter-spacing: .08em; color: #c9b6a8">CON</span><span style="font: 800 26px/1 Outfit, sans-serif">+2</span><span style="min-width: 34px; padding: 3px 0; border-radius: 999px; background: #120d0b; font-size: 12px; color: #c9b6a8">14</span></button><button type="button" aria-label="Roll INT check" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.10); background: #2a201b; color: #f3e6da"><span style="font: 700 11px/1 'DM Sans', sans-serif; letter-spacing: .08em; color: #c9b6a8">INT</span><span style="font: 800 26px/1 Outfit, sans-serif">+1</span><span style="min-width: 34px; padding: 3px 0; border-radius: 999px; background: #120d0b; font-size: 12px; color: #c9b6a8">12</span></button><button type="button" aria-label="Roll WIS check" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.10); background: #2a201b; color: #f3e6da"><span style="font: 700 11px/1 'DM Sans', sans-serif; letter-spacing: .08em; color: #c9b6a8">WIS</span><span style="font: 800 26px/1 Outfit, sans-serif">+3</span><span style="min-width: 34px; padding: 3px 0; border-radius: 999px; background: #120d0b; font-size: 12px; color: #c9b6a8">16</span></button><button type="button" aria-label="Roll CHA check" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.10); background: #2a201b; color: #f3e6da"><span style="font: 700 11px/1 'DM Sans', sans-serif; letter-spacing: .08em; color: #c9b6a8">CHA</span><span style="font: 800 26px/1 Outfit, sans-serif">−1</span><span style="min-width: 34px; padding: 3px 0; border-radius: 999px; background: #120d0b; font-size: 12px; color: #c9b6a8">8</span></button></div>
    <h3 style="margin: 4px 0 0; font: 700 15px/1.2 Outfit, sans-serif">Skills</h3>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column"><li><button type="button" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: #f3e6da; text-align: left"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px #c9b6a8"></span><span style="flex: 1; font-size: 13px">Medicine <span style="color: #c9b6a8; font-size: 11px">WIS</span></span><span style="font: 700 14px/1 Outfit, sans-serif; color: #f3e6da">+3</span></button></li><li><button type="button" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: #f3e6da; text-align: left"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #f47a1f"></span><span style="flex: 1; font-size: 13px">Nature <span style="color: #c9b6a8; font-size: 11px">INT</span></span><span style="font: 700 14px/1 Outfit, sans-serif; color: #ffb347">+4</span></button></li><li><button type="button" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: #f3e6da; text-align: left"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #f47a1f"></span><span style="flex: 1; font-size: 13px">Perception <span style="color: #c9b6a8; font-size: 11px">WIS</span></span><span style="font: 700 14px/1 Outfit, sans-serif; color: #ffb347">+6</span></button></li><li><button type="button" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: #f3e6da; text-align: left"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px #c9b6a8"></span><span style="flex: 1; font-size: 13px">Performance <span style="color: #c9b6a8; font-size: 11px">CHA</span></span><span style="font: 700 14px/1 Outfit, sans-serif; color: #f3e6da">−1</span></button></li><li><button type="button" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: #f3e6da; text-align: left"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px #c9b6a8"></span><span style="flex: 1; font-size: 13px">Persuasion <span style="color: #c9b6a8; font-size: 11px">CHA</span></span><span style="font: 700 14px/1 Outfit, sans-serif; color: #f3e6da">−1</span></button></li><li><button type="button" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: #f3e6da; text-align: left"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px #c9b6a8"></span><span style="flex: 1; font-size: 13px">Religion <span style="color: #c9b6a8; font-size: 11px">INT</span></span><span style="font: 700 14px/1 Outfit, sans-serif; color: #f3e6da">+1</span></button></li><li><button type="button" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; border: 0; background: transparent; color: #f3e6da; text-align: left"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px #c9b6a8"></span><span style="flex: 1; font-size: 13px">Sleight of Hand <span style="color: #c9b6a8; font-size: 11px">DEX</span></span><span style="font: 700 14px/1 Outfit, sans-serif; color: #f3e6da">+4</span></button></li></ul>
  </div>
  <div style="display: flex; gap: 8px; padding: 12px 16px 30px; border-top: 1px solid rgba(255,255,255,0.10); background: #1f1714">
    <button type="button" style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.10); background: #2a201b; color: #f3e6da; font: 700 14px/1 'DM Sans', sans-serif">Short rest</button>
    <button type="button" style="flex: 1; height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.10); background: #2a201b; color: #f3e6da; font: 700 14px/1 'DM Sans', sans-serif">Long rest</button>
  </div>
