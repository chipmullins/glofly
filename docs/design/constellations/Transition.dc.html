<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Into Constellations</title>
<script src="./support.js"></script>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;family=Outfit:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#b8430a}a:hover{color:#8a3005}
button{font:inherit}
.home{position:absolute;inset:0;display:flex;transform-origin:150px 250px}
.home.out{animation:homeOut 800ms cubic-bezier(.5,0,.75,0) forwards}
.home.gone{display:none}
@keyframes homeOut{to{transform:translateX(-30%) scale(.94);opacity:0;filter:blur(3px)}}
.night{position:absolute;inset:0;background:#120c0a;clip-path:circle(0px at 150px 250px);pointer-events:none;overflow:hidden}
.night.on{animation:nightIn 950ms cubic-bezier(.22,.7,.2,1) forwards;pointer-events:auto}
.night.done{clip-path:none;pointer-events:auto}
@keyframes nightIn{from{clip-path:circle(0px at 150px 250px)}to{clip-path:circle(1700px at 150px 250px)}}
.star{position:absolute;border-radius:50%;background:#f5ede6;opacity:0}
.star.gold{background:#ffb347;box-shadow:0 0 8px 2px rgba(255,165,74,.45)}
.night.on .star{animation:warp 1100ms ease-out forwards}
.night.done .star,.night.leave .star{opacity:.8;animation:twinkle 2.8s ease-in-out infinite}
@keyframes warp{0%{opacity:0;transform:translateX(220px) scaleX(1)}35%{opacity:1;transform:translateX(60px) scaleX(10)}100%{opacity:.85;transform:translateX(0) scaleX(1)}}
@keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
.content{animation:fadeUp 650ms ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* Glofly fireflies: wings flap, the light (the chat-bubble tail) pulses */
.ff{display:block;overflow:visible}
.ff .wl,.ff .wr{transform-box:view-box;transform-origin:140px 92px}
.ff .wl{animation:flapL var(--flap,170ms) ease-in-out infinite alternate}
.ff .wr{animation:flapR var(--flap,170ms) ease-in-out infinite alternate}
@keyframes flapL{from{transform:rotate(0) scale(1)}to{transform:rotate(-16deg) scale(.84)}}
@keyframes flapR{from{transform:rotate(0) scale(1)}to{transform:rotate(16deg) scale(.84)}}
.ff .light{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 4px rgba(255,179,71,.55)) brightness(1)}50%{filter:drop-shadow(0 0 16px rgba(255,200,90,1)) brightness(1.35)}}
.swarm{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fly{position:absolute;left:calc(100% + 20px);animation:flyLeft 1100ms cubic-bezier(.45,.1,.75,.95) both}
.fly .drift{animation:driftUp 1100ms ease-in-out both}
.fly .drift.down{animation-name:driftDown}
.fly .drift.flat{animation-name:driftFlat}
.fly .bob{animation:bob 420ms ease-in-out infinite alternate}
.fly .face{transform:scaleX(-1)}
@keyframes flyLeft{0%{left:calc(100% + 20px);opacity:0}8%{opacity:1}86%{opacity:1}100%{left:-300px;opacity:0}}
@keyframes driftUp{from{transform:translateY(40px) rotate(-6deg)}to{transform:translateY(-80px) rotate(4deg)}}
@keyframes driftDown{from{transform:translateY(-40px) rotate(4deg)}to{transform:translateY(80px) rotate(-6deg)}}
@keyframes driftFlat{from{transform:translateY(10px)}to{transform:translateY(-20px)}}
@keyframes bob{from{transform:translateY(-6px)}to{transform:translateY(6px)}}
.night.leave{clip-path:none;animation:nightLeave 900ms cubic-bezier(.5,0,.75,0) 250ms forwards}
@keyframes nightLeave{to{transform:translateX(30%) scale(.94);opacity:0;filter:blur(3px)}}
.home.in{animation:homeIn 950ms cubic-bezier(.2,.7,.2,1) 350ms both}
@keyframes homeIn{from{transform:translateX(-30%) scale(.94);opacity:0;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}
/* Small fireflies circling in the night sky */
.wander{position:absolute;width:0;height:0;will-change:transform}
.wander .ffbox{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
/* Orange stars pulse and glow (durations differ so they never pulse together) */
.night.done .star.gold,.night.leave .star.gold{animation:goldPulse 3.2s ease-in-out infinite}
.night.done .star.gold:nth-child(3n),.night.leave .star.gold:nth-child(3n){animation-duration:4s}
.night.done .star.gold:nth-child(4n),.night.leave .star.gold:nth-child(4n){animation-duration:2.7s}
.night.done .star.gold:nth-child(5n),.night.leave .star.gold:nth-child(5n){animation-duration:4.6s}
@keyframes goldPulse{0%,100%{opacity:.42;box-shadow:0 0 3px 1px rgba(255,165,74,.25);transform:scale(1)}50%{opacity:.92;box-shadow:0 0 11px 4px rgba(255,165,74,.65);transform:scale(1.3)}}
@media (prefers-reduced-motion: reduce){.swarm{display:none}.night.done .star.gold,.night.leave .star.gold{animation:none;opacity:.9}.night.leave{animation:none;opacity:0}.home.in{animation:none}.ff .wl,.ff .wr,.ff .light{animation:none}}
@media (prefers-reduced-motion: reduce){.home.out{animation:none;display:none}.night.on{animation:none;clip-path:none}.night.on .star,.night.done .star{animation:none;opacity:.8}.content{animation:none}}
</style>
</helmet>

  <div class="{{nightClass}}" aria-hidden="{{nightHidden}}">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { phase: 'home' };
    let seed = 7;
    const rnd = () => {
      seed = (seed * 9301 + 49297) % 233280;
      return seed / 233280;
    };
    this.stars = Array.from({ length: 112 }, (_, i) => {
      const gold = i % 6 === 0;
      return {
        x: Math.round(rnd() * 1000) / 10,
        y: Math.round(rnd() * 1000) / 10,
        size: gold ? (rnd() < 0.4 ? 4 : 3) : rnd() < 0.12 ? 2.5 : rnd() < 0.5 ? 2 : 1.5,
        delay: Math.round(rnd() * 380),
        cls: gold ? 'star gold' : 'star',
      };
    });
    // The swarm that carries you home: Glofly fireflies of many sizes.
    // Spread out: each one gets its own lane (shuffled), start time and up/down drift, and the
    // big (near) ones fly faster than the small (far) ones, so they never bunch up.
    const lanes = Array.from({ length: 30 }, (_, i) => i).sort(() => rnd() - 0.5);
    const drifts = ['drift', 'drift down', 'drift flat'];
    this.swarm = lanes.map((lane, i) => {
      const w = Math.round(22 + rnd() * rnd() * 110);
      return {
        w,
        h: Math.round((w * 190) / 256),
        y: Math.round(2 + (lane / 30) * 88 + rnd() * 2),
        delay: Math.round((i / 30) * 600 + rnd() * 60),
        dur: Math.round(1250 - w * 3 + rnd() * 150),
        drift: drifts[i % 3],
        bob: Math.round(rnd() * 400),
        flap: Math.round(110 + rnd() * 120),
      };
    });
    // A few small ones wandering the night sky on lazy, never-repeating paths: each is a sum of
    // slow sine waves with its own speeds, and it turns to face the way it's flying.
    this.els = [];
    this.orbiters = [
      { x: 76, y: 24, w: 18 },
      { x: 20, y: 70, w: 14 },
      { x: 56, y: 84, w: 16 },
      { x: 38, y: 32, w: 12 },
      { x: 88, y: 56, w: 15 },
    ].map((o, i) => ({
      ...o,
      h: Math.round((o.w * 190) / 256),
      flap: 130 + i * 15,
      ref: (el) => (this.els[i] = el),
      wx: [70 + rnd() * 90, 20 + rnd() * 30],
      wy: [45 + rnd() * 55, 12 + rnd() * 25],
      fx: [0.16 + rnd() * 0.18, 0.3 + rnd() * 0.2],
      fy: [0.14 + rnd() * 0.18, 0.28 + rnd() * 0.2],
      px: [rnd() * 6.28, rnd() * 6.28],
      py: [rnd() * 6.28, rnd() * 6.28],
    }));
  }
  componentDidMount() {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    const t0 = performance.now();
    let last = t0;
    const step = (now) => {
      const t = (now - t0) / 1000;
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      this.orbiters.forEach((o, i) => {
        const el = this.els[i];
        if (!el) return;
        const x = o.wx[0] * Math.sin(t * o.fx[0] + o.px[0]) + o.wx[1] * Math.sin(t * o.fx[1] + o.px[1]);
        const y = o.wy[0] * Math.sin(t * o.fy[0] + o.py[0]) + o.wy[1] * Math.sin(t * o.fy[1] + o.py[1]);
        const vx = o.wx[0] * o.fx[0] * Math.cos(t * o.fx[0] + o.px[0]) + o.wx[1] * o.fx[1] * Math.cos(t * o.fx[1] + o.px[1]);
        const vy = o.wy[0] * o.fy[0] * Math.cos(t * o.fy[0] + o.py[0]) + o.wy[1] * o.fy[1] * Math.cos(t * o.fy[1] + o.py[1]);
        // The logo points up and to the right (about -35°): turn it toward the flight direction,
        // mirrored when flying left, tilted at most 35° so it never flies upside down.
        // Turn smoothly: always rotate toward the flight direction along the shortest way round,
        // easing a little each frame, so a turnaround is one smooth swing (no mirroring, no snap).
        // The logo itself points up and to the right (about -35°), hence the +35.
        const heading = (Math.atan2(vy, vx) * 180) / Math.PI + 35;
        if (o.rot === undefined) o.rot = heading;
        const diff = ((heading - o.rot + 540) % 360) - 180;
        o.rot += diff * Math.min(1, dt * 2.5);
        el.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) rotate(${o.rot.toFixed(1)}deg)`;
      });
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  }
  componentWillUnmount() {
    clearTimeout(this.timer);
    cancelAnimationFrame(this.raf);
  }
  start() {
    clearTimeout(this.timer);
    this.setState({ phase: 'sweep' });
    this.timer = setTimeout(() => this.setState({ phase: 'space' }), 1050);
  }
  back() {
    clearTimeout(this.timer);
    this.setState({ phase: 'return' });
    this.timer = setTimeout(() => this.setState({ phase: 'home' }), 2100);
  }
  renderVals() {
    const phase = this.state.phase;
    return {
      homeClass: phase === 'home' ? 'home' : phase === 'sweep' ? 'home out' : phase === 'return' ? 'home in' : 'home gone',
      nightClass: phase === 'home' ? 'night' : phase === 'sweep' ? 'night on' : phase === 'return' ? 'night leave' : 'night done',
      nightHidden: phase === 'home' ? 'true' : 'false',
      inSpace: phase === 'space' || phase === 'return',
      returning: phase === 'return',
      stars: this.stars,
      swarm: this.swarm,
      orbiters: this.orbiters,
      goHome: () => this.back(),
      go: () => this.start(),
      reset: () => {
        clearTimeout(this.timer);
        this.setState({ phase: 'home' });
      },
      replay: () => {
        clearTimeout(this.timer);
        this.setState({ phase: 'home' });
        this.timer = setTimeout(() => this.start(), 400);
      },
    };
  }
}
</script>
